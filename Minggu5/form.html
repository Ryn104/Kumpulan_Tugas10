<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Register IT Club</h1>

<form action="">
    <table>
        <tr>
            <td><label for="nama">Nama:</label></td>
            <td><input type="text" required></td>
        </tr>
        <tr>
            <td><label for="email">Email:</label></td>
            <td><input type="email" required></td>
        </tr>
        <tr>
            <td><label for="password">Password:</label></td>
            <td><input type="password" required></td>
        </tr>
    </table>
    <br>
    
    <label for="jk">Jenis Kelamin</label>
    <br>
    <input type="radio" value="lakilaki" name="JenisKelamin">
    <label for="lakilaki">Laki-laki</label>
    <input type="radio" value="perempuan" name="JenisKelamin">
    <label for="perempuan">Perempuan</label>
    <br>
    <br>

    <label for="skill">Kemampuan yang ingin dipelajari</label>
    <br>
    <input type="checkbox" value="html" name="skill">
    <label for="html">HTML</label>
    <input type="checkbox" value="css" name="skill">
    <label for="css">CSS</label>
    <input type="checkbox" value="javaScript" name="skill">
    <label for="javaScript">JavaScript</label>
    <br>
    <br>

    <label for="alasan">Alasan Bergabung</label>
    <br>
    <textarea name="alasan" cols="20" rows="5""></textarea>
    <br>
    <br>
    <input type="submit" name="submit" value="Daftar">
</form>
    
<br><input type="button" value="Button">

<br><input type="color">

<br><input type="url">
<br><input type="week">

</body>
</html>
